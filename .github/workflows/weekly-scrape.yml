name: Weekly scrape

# Scrape rent listings from the last 7 days and load them into the database.
# Manual only: some listing sites refuse requests from cloud servers, so the weekly
# run happens on a local machine (scripts/register-weekly-task.ps1). Use the
# "Run workflow" button for a cloud run of sites that allow it.
on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "Only keep listings from the last N days"
        default: "7"
      site:
        description: "Which site to scrape (npc, propertypro or all)"
        default: "propertypro"
      max_pages:
        description: "Upper bound on pages per site/category"
        default: "30"

concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Scrape last week and load into the database
        run: >
          uv run python -m entrypoints.cli weekly-scrape
          --since-days "${{ inputs.since_days || '7' }}"
          --max-pages "${{ inputs.max_pages || '30' }}"
          --site "${{ inputs.site || 'propertypro' }}"
          --triggered-by "github-actions:manual"

      - name: Pre-build area guides for the top areas
        # Optional: needs GROQ_API_KEY and TAVILY_API_KEY secrets. A failure here never fails the scrape.
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ -z "$GROQ_API_KEY" ] || [ -z "$TAVILY_API_KEY" ]; then
            echo "GROQ_API_KEY or TAVILY_API_KEY secret not set, skipping guides."
            exit 0
          fi
          uv run python -m entrypoints.cli warm-guides --top 15

      - name: Upload run CSV and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-run-${{ github.run_id }}
          path: data/raw/runs/
          if-no-files-found: ignore
          retention-days: 30
