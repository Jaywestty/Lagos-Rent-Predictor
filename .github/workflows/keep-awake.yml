# Pings the Render free API so it doesn't fall asleep after 15 idle minutes.
# /health answers without touching the database or the AI, so each ping costs nothing.
# GitHub may start scheduled runs a few minutes late, and turns schedules off after
# 60 days without commits: re-enable it from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL || 'https://adugbo-ai-api.onrender.com' }}
        run: |
          # A sleeping server can take about a minute to wake, so allow retries.
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               "$API_URL/health"
          echo
